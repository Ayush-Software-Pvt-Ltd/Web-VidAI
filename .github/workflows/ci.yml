# Windows CI on a real Windows runner:
# - "windows": the gates of `npm run check`, then the NSIS installer, which is installed, started,
#   closed and uninstalled again (scripts/e2e/windows/installer-smoke.mjs);
# - "e2e": the end-to-end suite (`npm run e2e`) against the real debug app, with screenshots.
# Both upload what they produced (installer, screenshots, app logs, reports), also when a step
# fails. A manual run can pick either job and a subset of the scenarios, so an iteration on one
# of them does not repeat the other.
# macOS is checked locally with `npm run check` and `npm run e2e` (macOS runner minutes cost ten
# times as much).
name: CI

on:
  workflow_dispatch:
    inputs:
      gates:
        description: "Gates of npm run check, installer build and installer test"
        type: boolean
        default: true
      e2e:
        description: "End-to-end suite"
        type: boolean
        default: true
      scenarios:
        description: "Only these end-to-end scenarios (names or name prefixes, space-separated; empty: all)"
        type: string
        default: ""
  push:
    branches: ["windows*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows x64
    if: ${{ github.event_name == 'push' || inputs.gates }}
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          bash --version | head -n 1
          git --version

      # The picture check tests (src-tauri/tests/picture_check_windows.rs) decode and encode video
      # with Media Foundation, which every Windows 10 and 11 desktop has but Windows Server only as
      # an optional feature.
      - name: Media Foundation
        shell: pwsh
        run: |
          if (-not (Get-WindowsFeature Server-Media-Foundation).Installed) {
            Install-WindowsFeature Server-Media-Foundation | Format-List
          }
          Get-WindowsFeature Server-Media-Foundation | Format-List Name, InstallState

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: cargo fmt
        run: npm run rust:fmt

      - name: cargo clippy
        run: npm run rust:clippy

      # `npm run rust:test`, but reporting every failing test binary at once.
      - name: cargo test
        timeout-minutes: 25
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      # Also after a failed gate above, so one run shows every problem; the job fails anyway.
      - name: Build the installer
        id: installer
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run tauri build

      # The version of tauri.conf.json, which names the installer file (VidAI_<version>_x64-setup.exe)
      # and, here, the artifact, so a version bump needs no change of this file.
      - name: Version of the app
        id: version
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the installer
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: VidAI-${{ steps.version.outputs.version }}-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Install, start, close and uninstall the installer
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: node scripts/e2e/windows/installer-smoke.mjs src-tauri/target/release/bundle/nsis/*-setup.exe "$RUNNER_TEMP/installer"

      - name: Upload the installer test
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-test
          path: ${{ runner.temp }}/installer
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Windows x64 end-to-end
    if: ${{ github.event_name == 'push' || inputs.e2e }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Also kept when scenarios fail, so the next iteration does not build the app again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        id: deps
        run: npm ci

      # Diagnostics only: never stops the suite.
      - name: The desktop the app runs on
        continue-on-error: true
        shell: powershell
        run: |
          whoami
          query user 2>&1 | Out-String
          Get-CimInstance Win32_VideoController | Format-Table Name, CurrentHorizontalResolution, CurrentVerticalResolution
          try { Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" | Select-Object pv, name } catch { "WebView2 Runtime: not in the machine-wide registry" }
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -ErrorAction SilentlyContinue | Select-Object AppsUseLightTheme, SystemUsesLightTheme
          exit 0

      - name: End-to-end suite
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          # Word splitting of $SCENARIOS is wanted: one argument per scenario name.
          # shellcheck disable=SC2086
          npm run e2e -- --out "$RUNNER_TEMP/e2e" --keep --require-screenshots --verbose $SCENARIOS 2>&1 | tee "$RUNNER_TEMP/e2e/console.log"

      - name: Processes after the suite
        if: ${{ always() }}
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\e2e" | Out-Null
          Get-CimInstance Win32_Process | Sort-Object CreationDate | Format-Table -AutoSize -Wrap ProcessId, ParentProcessId, Name, CommandLine | Out-String -Width 400 | Set-Content "$env:RUNNER_TEMP\e2e\processes-after.txt"
          Get-Content "$env:RUNNER_TEMP\e2e\processes-after.txt" | Select-String -Pattern "VidAI|bash|msedgewebview2|sleep" | Out-String -Width 400
          exit 0

      - name: Upload screenshots, logs and reports
        if: ${{ always() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: |
            ${{ runner.temp }}/e2e
            node_modules/.cache/vidai-e2e/*.log
            !${{ runner.temp }}/e2e/**/Editing/CLAUDE_VE_ALL/**
            !${{ runner.temp }}/e2e/**/media/**
            !${{ runner.temp }}/e2e/**/step-*.js
          if-no-files-found: warn
          retention-days: 14
