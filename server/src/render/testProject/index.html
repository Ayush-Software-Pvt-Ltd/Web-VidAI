<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="shared/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #101418; }
      .clip { position: absolute; inset: 0; }
      #title { display: flex; align-items: center; justify-content: center; font-family: "Inter", sans-serif; font-size: 96px; font-weight: 700; color: #f4f6f8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="2">
      <div id="title" class="clip" data-start="0" data-duration="2" data-track-index="1">VidAI test render</div>
    </div>
    <script>
(function () {
  window.__timelines = window.__timelines || {};
  var timeline = gsap.timeline({ paused: true });
  timeline.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 0);
  timeline.to({}, { duration: 2 }, 0);
  window.__timelines["main"] = timeline;
})();
    </script>
  </body>
</html>
