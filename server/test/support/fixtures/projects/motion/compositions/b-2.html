#b-2-root { position: absolute; inset: 0; overflow: hidden; }
#b-2-motion { position: absolute; inset: 0; transform-origin: 50% 50%; }
#b-2-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
<div id="b-2-root" data-composition-id="b-2" data-width="1920" data-height="1080">
  <div id="b-2-motion" data-vidai-motion='{"scale":[1.08,1.08],"x":[76.8,-76.8],"duration":2}'>
    <video id="b-2-video" class="clip" src="assets/media/broll.mp4" muted playsinline data-start="0" data-duration="50" data-media-start="10" data-track-index="0"></video>
  </div>
</div>
<script>
(function () {
const tl = gsap.timeline({ paused: true });
const m = JSON.parse(document.getElementById("b-2-motion").getAttribute("data-vidai-motion"));
tl.fromTo("#b-2-motion", { scale: m.scale[0], x: m.x[0] }, { scale: m.scale[1], x: m.x[1], duration: m.duration, ease: "none" }, 0);
window.__timelines["b-2"] = tl;
})();
</script>
