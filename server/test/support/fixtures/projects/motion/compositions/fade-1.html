<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: Kit, sans-serif; }
        #root .card { position: absolute; left: 80px; bottom: 120px; color: #fff; background: url("shared/card.png"); }
      </style>
      <div id="root" data-composition-id="fade-1" data-width="1920" data-height="1080">
        <div class="card" id="fade-1-card">fade-1</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#fade-1-card", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
        window.__timelines["fade-1"] = tl;
      </script>
    </template>
  </body>
</html>
