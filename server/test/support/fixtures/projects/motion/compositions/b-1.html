<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
#b-1-root { position: absolute; inset: 0; overflow: hidden; }
#b-1-motion { position: absolute; inset: 0; transform-origin: 50% 50%; }
#b-1-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
<div id="b-1-root" data-composition-id="b-1" data-width="1920" data-height="1080">
  <div id="b-1-motion" data-vidai-motion='{"scale":[1,1.1],"x":[0,0],"duration":3}'>
    <video id="b-1-video" class="clip" src="assets/media/broll.mp4" muted playsinline data-start="0" data-duration="58" data-media-start="2" data-track-index="0"></video>
  </div>
</div>
<script>
(function () {
const tl = gsap.timeline({ paused: true });
const m = JSON.parse(document.getElementById("b-1-motion").getAttribute("data-vidai-motion"));
tl.fromTo("#b-1-motion", { scale: m.scale[0], x: m.x[0] }, { scale: m.scale[1], x: m.x[1], duration: m.duration, ease: "none" }, 0);
window.__timelines["b-1"] = tl;
})();
</script>
</template>
</body>
</html>
