      <video id="a-2" class="clip" src="assets/media/aroll.mp4" playsinline data-has-audio="true" data-start="5" data-duration="5" data-media-start="3" data-track-index="0" data-vidai-kind="aroll" data-vidai-label="Point" data-fade-in="0.008" style="z-index:0"></video>
      <video id="a-3" class="clip" src="assets/media/aroll.mp4" playsinline data-has-audio="true" data-start="10" data-duration="5" data-media-start="8" data-track-index="0" data-vidai-kind="aroll" data-vidai-label="Offer" data-fade-out="0.5" style="z-index:0"></video>

    </div>
    <script>
(function () {
  window.__timelines = window.__timelines || {};
  var root = document.getElementById("root");
  var length = Math.max(0, Number(root.getAttribute("data-duration")) || 0);
  var timeline = gsap.timeline({ paused: true });
  timeline.to({}, { duration: length }, 0);
  window.__timelines["main"] = timeline;
})();
    </script>
