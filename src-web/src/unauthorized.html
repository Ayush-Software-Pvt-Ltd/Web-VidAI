<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>VidAI Web</title>
    <!--
      The card of the connection notice in the app (src/app/ConnectionNotice.tsx, OnboardingCard),
      drawn at the default text size (15 pt, so every size of the app is 15/13 larger) with the
      tokens of src/styles.css. Self-contained: no script, no request (Content-Security-Policy:
      default-src 'self', style-src 'unsafe-inline').
    -->
    <style>
      :root {
        --window: #ececee;
        --elevated: #ffffff;
        --subtle: rgb(245 245 247 / 0.6);
        --separator: rgb(0 0 0 / 0.07);
        --fg: #1d1d1f;
        --fg-muted: #5f5f66;
        --warning: #a05a00;
        --warning-soft: rgb(220 140 0 / 0.16);
        --shadow: 0 24px 64px rgb(0 0 0 / 0.22), 0 0 0 0.5px rgb(0 0 0 / 0.12);
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Monaco, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --window: #1e1e20;
          --elevated: #2a2a2d;
          --subtle: rgb(34 34 37 / 0.6);
          --separator: rgb(255 255 255 / 0.12);
          --fg: #f2f2f5;
          --fg-muted: #a8a8b0;
          --warning: #f0b14a;
          --warning-soft: rgb(240 177 74 / 0.16);
          --shadow: 0 24px 64px rgb(0 0 0 / 0.55), 0 0 0 0.5px rgb(255 255 255 / 0.12);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        section {
          animation: pop-in 140ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 28px;
        font: 15px/21px var(--sans);
        color: var(--fg);
        background: var(--window);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 600px;
        max-width: 100%;
      }
      section {
        border-radius: 14px;
        background: var(--elevated);
        box-shadow: var(--shadow);
      }
      .body {
        padding: 26px 26px 22.5px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 11.25px;
      }
      .icon {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 37.5px;
        height: 37.5px;
        border-radius: 14px;
        background: var(--warning-soft);
        color: var(--warning);
      }
      .icon svg {
        width: 18.75px;
        height: 18.75px;
      }
      h1 {
        margin: 0;
        min-width: 0;
        font-size: 19.6px;
        line-height: 25.4px;
        font-weight: 600;
        color: var(--fg);
      }
      .text {
        margin-top: 15px;
        color: var(--fg-muted);
        text-wrap: pretty;
      }
      .text p {
        margin: 0;
      }
      code {
        font-family: var(--mono);
        color: var(--fg);
      }
      .nowrap {
        white-space: nowrap;
      }
      footer {
        min-height: 65px;
        display: flex;
        align-items: center;
        padding: 11.25px 26px;
        border-top: 1px solid var(--separator);
        border-radius: 0 0 14px 14px;
        background: var(--subtle);
        font-size: 13.85px;
        line-height: 18.5px;
        color: var(--fg-muted);
      }
      footer p {
        margin: 0;
      }
      @media (max-width: 480px) {
        body {
          padding: 16px;
        }
        .body {
          padding: 22px 18px 20px;
        }
        footer {
          padding: 11.25px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="title">
        <div class="body">
          <header>
            <div class="icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
                />
                <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" />
              </svg>
            </div>
            <h1 id="title">VidAI Web needs its own address</h1>
          </header>
          <div class="text">
            <p>
              Open the address that <code>vidai-web</code> printed when it started. It ends with
              <code class="nowrap">?token=</code> and a long code.
            </p>
          </div>
        </div>
        <footer>
          <p>Opening it once is enough: this browser then remembers it.</p>
        </footer>
      </section>
    </main>
  </body>
</html>
