<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B0F4D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 body centered on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <!-- play glyph with rounded corners -->
    <path d="M410 330 C410 300 442 282 468 297 L716 470 C740 486 740 522 716 538 L468 711 C442 726 410 708 410 678 Z" fill="#FFFFFF"/>
    <!-- spark -->
    <path d="M300 268 L316 316 L364 332 L316 348 L300 396 L284 348 L236 332 L284 316 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
