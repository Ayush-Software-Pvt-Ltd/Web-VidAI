[package]
name = "vidai"
version = "0.2.4"
description = "VidAI starts, tracks, pauses, continues, stops and re-edits AI video edits done by Claude Code"
authors = ["VidAI"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (a Windows quirk, see
# https://github.com/rust-lang/cargo/issues/8519).
name = "vidai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the minimum macOS version for the native helpers (build.rs).
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
# Toolkit seeding (toolkit.rs): the bundled toolkit.tar.gz.
tar = "0.4"
flate2 = "1"
# OpenCode key test and model list (opencode/http.rs): rustls with the OS trust store, no OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit calls of platform/appkit.rs (the traffic lights follow the text size). Same versions as tao uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSAppearance",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

# Windows (SPEC section 11). Every crate has a safe API, so no Windows code needs `unsafe`.
[target.'cfg(windows)'.dependencies]
# Process trees: kill-on-close job objects (platform/process/windows.rs).
win32job = "2.1"
# Process ids, parents, start times and command lines; ending single processes.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# The API keys in the Windows Credential Manager (secrets.rs).
keyring-core = "1"
windows-native-keyring-store = "1.1"
# Sleep prevention while jobs run (platform/power.rs).
keepawake = "0.6"
# Telling a letter-case-only channel rename apart from another folder (commands/settings/channels.rs).
same-file = "1"
# The user's current PATH from the registry (platform/windows.rs).
windows-registry = "0.6"
# A second launch hands its right to take the foreground to the running copy (instance.rs).
winsafe = { version = "0.0.29", features = ["user"] }
# The picture check (platform/orientation/winrt.rs): frames from Windows.Media.Editing, faces from
# Windows.Media.FaceAnalysis. WinRT calls are safe Rust. The same version Tauri already uses.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Editing",
  "Media_FaceAnalysis",
  "Media_MediaProperties",
  "Media_Transcoding",
  "Security_Cryptography",
  "Storage",
  "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Denied everywhere; only the functions of platform/appkit.rs that call AppKit allow it (see its module docs).
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
