<!doctype html>
<html lang="hi" data-resolution="portrait"
  data-composition-variables='[{"id":"text","type":"string","label":"Hit text","default":"Inbuilt USB-C Cable"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="shared/js/gsap.min.js"></script>
    <script src="shared/sj.js"></script>
    <link rel="stylesheet" href="shared/sj.css" />
    <style>
      @font-face { font-family: "Baloo 2"; src: url("shared/fonts/Baloo2-VF.ttf") format("truetype"); font-weight: 400 800; }
      /* Keyword hit over the host: lives in the empty backdrop above the head (y 170-420). */
      #zone { position: absolute; left: 60px; right: 60px; top: 170px; height: 250px; display: flex; align-items: center; justify-content: center; }
      #slab { font-size: 104px; white-space: nowrap; box-shadow: 0 18px 0 rgba(0, 0, 0, 0.35); padding: 14px 48px 4px; }
      #txt { display: inline-block; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="zone">
        <div id="slab" class="sj-slab"><span id="txt">Inbuilt USB-C Cable</span></div>
      </div>
    </div>
    <script>
      const D = 6;
      const tl = gsap.timeline({ paused: true });
      document.fonts.ready.then(function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const txt = document.getElementById("txt");
        if (v.text) txt.textContent = v.text;
        // fit the text itself, so the slab keeps its side padding (slab <= 860 px wide)
        SJ.fit(txt, 760, 200, 56);
        tl.fromTo("#slab", { scale: 0.2, rotation: -8, opacity: 0 }, { scale: 1, rotation: -2, opacity: 1, duration: 0.28, ease: "back.out(2.6)" }, 0);
        // keeps alive while on screen: slow growth and a small counter-tilt
        tl.fromTo("#zone", { scale: 1, y: 0 }, { scale: 1.06, y: -10, duration: D - 0.3, ease: "sine.inOut" }, 0.3);
        tl.fromTo("#slab", { rotation: -2 }, { rotation: 1.5, duration: D - 0.3, ease: "sine.inOut", immediateRender: false }, 0.3);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
