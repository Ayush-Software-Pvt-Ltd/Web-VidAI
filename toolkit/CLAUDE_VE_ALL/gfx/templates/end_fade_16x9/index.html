<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="shared/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      /* Dark fade: transparent to black over the first 0.5 s, then black. */
      #black { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="black"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#black", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, 0);
      tl.to("#black", { opacity: 1, duration: 1.55 }, 0.45);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
