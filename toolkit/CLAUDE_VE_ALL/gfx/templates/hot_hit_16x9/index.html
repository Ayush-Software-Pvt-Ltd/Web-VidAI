<!doctype html>
<html lang="hi" data-resolution="landscape"
  data-composition-variables='[{"id":"text","type":"string","label":"Hit text","default":"55 inch 4K"},{"id":"accent","type":"string","label":"Accent: orange, cyan, green, red or white","default":"orange"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="shared/js/gsap.min.js"></script>
    <script src="shared/hot/ht.js"></script>
    <link rel="stylesheet" href="shared/hot/ht.css" />
    <link rel="stylesheet" href="shared/hot/ht16.css" />
    <style>
      /* House of Tech keyword hit over the host, landscape: lower third (y 760-950), clear of
         the face and of the bottom 6 % of the frame. */
      #zone { position: absolute; left: 120px; right: 120px; top: 760px; height: 190px; display: flex; align-items: center; justify-content: center; }
      #slab { position: relative; font-size: 96px; white-space: nowrap; padding: 12px 54px 4px; border-radius: 22px;
        box-shadow: 0 18px 0 rgba(5, 8, 19, 0.55), 0 0 60px rgba(25, 211, 255, 0.45); }
      #bar { position: absolute; left: 0; top: 0; bottom: 0; width: 20px; border-radius: 22px 0 0 22px; background: var(--orange); }
      #txt { display: inline-block; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="zone">
        <div id="slab" class="ht-slab"><div id="bar"></div><span id="txt">55 inch 4K</span></div>
      </div>
    </div>
    <script>
      const D = 6;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      document.fonts.ready.then(function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const txt = document.getElementById("txt");
        if (v.text) txt.textContent = v.text;
        const ACC = { orange: "#ff6b1a", cyan: "#19d3ff", green: "#2ee59d", red: "#ff3b4e", white: "#ffffff" };
        if (v.accent && ACC[v.accent]) document.getElementById("bar").style.background = ACC[v.accent];
        HT.fit(txt, 1500, 150, 56);
        tl.fromTo("#slab", { x: -160, scaleX: 0.3, opacity: 0, skewX: -12 },
          { x: 0, scaleX: 1, opacity: 1, skewX: 0, duration: 0.26, ease: "back.out(2)" }, 0);
        tl.fromTo("#txt", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.08);
        tl.fromTo("#zone", { scale: 1, x: 0 }, { scale: 1.04, x: 10, duration: D - 0.3, ease: "sine.inOut" }, 0.3);
        tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out", transformOrigin: "50% 100%" }, 0.12);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
