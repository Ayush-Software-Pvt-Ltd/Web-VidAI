<!doctype html>
<html lang="hi" data-resolution="portrait"
  data-composition-variables='[{"id":"text","type":"string","label":"Hit text","default":"RED CLAY MASK"},{"id":"color","type":"string","label":"Slab colour (clay|blue|leaf)","default":"clay"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="shared/js/gsap.min.js"></script>
    <script src="shared/kc/kc.js"></script>
    <link rel="stylesheet" href="shared/kc/kc.css" />
    <style>
      /* Kudrat Care keyword pop-up over the host: high top zone (y 70-280) for framings with the head higher (sofa set, 017), clear of the face,
         the bowls in her hands and the Shorts UI. */
      #zone { position: absolute; left: 110px; right: 110px; top: 70px; height: 210px; display: flex; align-items: center; justify-content: center; }
      #slab { position: relative; font-size: 88px; white-space: nowrap; padding: 14px 52px 0; border-radius: 30px; }
      #leaf { position: absolute; right: -26px; top: -30px; width: 74px; height: 74px; border-radius: 0 60% 0 60%;
        background: linear-gradient(135deg, #8fbf7a 0%, #2f6b3d 100%); box-shadow: 0 8px 18px rgba(0,0,0,0.2); }
      #txt { display: inline-block; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="zone">
        <div id="slab" class="kc-slab"><span id="txt">RED CLAY MASK</span><div id="leaf"></div></div>
      </div>
    </div>
    <script>
      const D = 6;
      const tl = gsap.timeline({ paused: true });
      document.fonts.load("800 100px 'Baloo 2'").then(function () { return document.fonts.ready; }).then(function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const txt = document.getElementById("txt");
        if (v.text) txt.textContent = v.text;
        if (v.color === "blue" || v.color === "leaf") document.getElementById("slab").classList.add(v.color);
        KC.fit(txt, 760, 200, 56);
        tl.fromTo("#slab", { y: 70, scale: 0.6, opacity: 0, rotation: -4 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(2.2)" }, 0);
        tl.fromTo("#txt", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.08);
        tl.fromTo("#leaf", { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 0.16);
        tl.fromTo("#zone", { scale: 1, y: 0 }, { scale: 1.05, y: -8, duration: D - 0.35, ease: "sine.inOut" }, 0.35);
        tl.fromTo("#leaf", { rotation: 0 }, { rotation: 12, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
