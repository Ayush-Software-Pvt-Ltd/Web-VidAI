<!doctype html>
<html lang="en" data-resolution="portrait"
  data-composition-variables='[{"id":"text","type":"string","label":"Hit text","default":"14 Place Settings"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="shared/js/gsap.min.js"></script>
    <script src="shared/hoa/hoa.js"></script>
    <link rel="stylesheet" href="shared/hoa/hoa.css" />
    <style>
      /* House of Apps keyword pop-up over the host: chest area (y 1180-1400), clear of the face,
         the Shorts UI at the bottom and the action rail on the right. A lime sticker with an
         ink offset block behind it. */
      #zone { position: absolute; left: 100px; right: 100px; top: 1180px; height: 220px; display: flex; align-items: center; justify-content: center; }
      #stick { position: relative; }
      #back { position: absolute; left: 14px; top: 14px; right: -14px; bottom: -14px; border-radius: 26px; background: var(--ink); }
      #slab { position: relative; font-size: 96px; padding: 10px 48px 6px; border-radius: 26px;
        box-shadow: 0 0 60px rgba(212, 255, 58, 0.35); }
      #txt { display: inline-block; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="zone">
        <div id="stick"><div id="back"></div><div id="slab" class="hoa-slab"><span id="txt">14 Place Settings</span></div></div>
      </div>
    </div>
    <script>
      const D = 6;
      const tl = gsap.timeline({ paused: true });
      document.fonts.load("900 96px Poppins").then(function () { return document.fonts.ready; }).then(function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const txt = document.getElementById("txt");
        if (v.text) txt.textContent = v.text;
        HOA.fit(txt, 790, 180, 52);
        tl.fromTo("#stick", { scale: 0.4, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.3, ease: "back.out(2.2)" }, 0);
        tl.fromTo("#txt", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.08);
        tl.fromTo("#back", { x: -14, y: -14 }, { x: 0, y: 0, duration: 0.25, ease: "power2.out" }, 0.12);
        // keeps alive while on screen
        tl.fromTo("#zone", { scale: 1, x: 0 }, { scale: 1.05, x: 6, duration: D - 0.3, ease: "sine.inOut" }, 0.3);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
