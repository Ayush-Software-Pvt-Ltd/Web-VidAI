<!doctype html>
<html lang="hi" data-resolution="landscape"
  data-composition-variables='[{"id":"text","type":"string","label":"Hit text","default":"Strike Price"},{"id":"tone","type":"string","label":"gold | bull | bear","default":"gold"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="shared/js/gsap.min.js"></script>
    <script src="shared/at/at.js"></script>
    <link rel="stylesheet" href="shared/at/at.css" />
    <style>
      /* Apna Trader keyword pop-up over the host: lower left (x 110-1000, y 790-950), clear of
         the centred host's face; transparent everywhere else. */
      #zone { position: absolute; left: 110px; top: 790px; width: 900px; height: 160px; display: flex; align-items: center; }
      #slab { position: relative; font-size: 76px; white-space: nowrap; padding: 14px 44px 4px 58px; border-radius: 16px;
        box-shadow: 0 14px 0 rgba(7, 11, 20, 0.55), 0 18px 50px rgba(0, 0, 0, 0.45); }
      #bar { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; border-radius: 16px 0 0 16px; background: var(--ink); opacity: 0.85; }
      #txt { display: inline-block; white-space: nowrap; line-height: 1.3; }
      #tick { position: absolute; left: 0; top: -26px; height: 10px; width: 120px; border-radius: 5px; background: var(--white); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="zone">
        <div id="slab" class="at-slab"><div id="bar"></div><div id="tick"></div><span id="txt">Strike Price</span></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const D = 4;
      const tl = gsap.timeline({ paused: true });
      AT.fonts().then(function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const txt = document.getElementById("txt");
        const slab = document.getElementById("slab");
        if (v.text) txt.textContent = v.text;
        if (v.tone === "bull" || v.tone === "bear") slab.classList.add(v.tone);
        AT.fit(txt, 760, 130, 48);
        tl.fromTo("#slab", { x: -160, scaleX: 0.25, opacity: 0, skewX: -14 }, { x: 0, scaleX: 1, opacity: 1, skewX: 0, duration: 0.28, ease: "back.out(2)", transformOrigin: "0% 50%" }, 0);
        tl.fromTo("#txt", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out" }, 0.08);
        tl.fromTo("#tick", { scaleX: 0, opacity: 0.9 }, { scaleX: 1, opacity: 0.9, duration: 0.3, ease: "power3.out", transformOrigin: "0% 50%" }, 0.14);
        // alive while on screen: slow growth and drift
        tl.fromTo("#zone", { scale: 1, x: 0 }, { scale: 1.04, x: 10, duration: D - 0.3, ease: "sine.inOut", transformOrigin: "0% 50%" }, 0.3);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
